[package]
name = "castellan-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Placebo-controlled proof pipeline: danger signal + guard-insertion proof."

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-ledger = { path = "../castellan-ledger" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "1.0.1", default-features = false, features = ["std", "u64_backend"] }
libc = "0.2"
