[package]
name = "castellan-envelope"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel envelope: Landlock ruleset + seccomp filter applied to launched sessions, plus the audit watcher."

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-policy = { path = "../castellan-policy" }
nix = { workspace = true }
rustc-hash = { workspace = true }
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# Forwards the P8 drill fault-injection hook (see castellan-core).
drills = ["castellan-core/drills"]
