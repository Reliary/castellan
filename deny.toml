[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# No ignores as of 2026-10-03: the long-tracked ed25519-dalek v2 upgrade
# landed (2.2.0; curve25519-dalek 4.1.3; rand dropped from the graph
# entirely), retiring RUSTSEC-2022-0093 (double-pubkey oracle),
# RUSTSEC-2024-0344 (scalar-sub timing) and RUSTSEC-2026-0097 (rand
# 0.7 custom-logger unsoundness). If a future advisory needs a written
# rationale before a fix exists, record it here AND mirror it into
# ci.yml's `cargo audit --ignore` flags (cargo-audit does not read this
# file).
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
# Intra-workspace path deps carry no version by design (single version in
# Cargo.toml [workspace.package]). skip-tree silences the wildcard lint for
# the workspace subtree; multiple-versions=warn above still catches drift.
skip-tree = [
  "castellan-broker", "castellan-campaign", "castellan-canary", "castellan-cli",
  "castellan-core", "castellan-daemon", "castellan-decoy", "castellan-drill",
  "castellan-envelope", "castellan-freezer", "castellan-hub", "castellan-keyring",
  "castellan-ledger", "castellan-memory", "castellan-pharmaco", "castellan-policy",
  "castellan-policycheck", "castellan-proof", "castellan-proxy", "castellan-radar",
  "castellan-replay", "castellan-scan", "castellan-trace", "castellan-trust",
  "castellan-voice",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
