name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, package and sign only; do not create a release'
        type: boolean
        default: true

# Top level stays read-only; the writes belong to the release job
# (Scorecard Token-Permissions #7).
permissions:
  contents: read

# Two dispatches for one tag must not race on the same draft; a published
# tag is immutable and the second run must not touch it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write — keyless cosign (OIDC → Fulcio). contents: write —
    # release assets. Signing is blocking: a release that cannot be signed
    # must not publish unsigned.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Privilege-bearing job (id-token: write + contents: write): every
      # action is SHA-pinned (review F-1 — the repo's own pinning rule).
      # rust-toolchain: pin is the stable BRANCH head (the action infers
      # the toolchain from the ref name, so the input makes it explicit);
      # rust-cache: annotated tag v2 peels to the v2.9.2 commit.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable@2026-10-03
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve workspace version
        run: |
          VERSION=$(awk '/^\[workspace.package\]/{f=1} f && /^version/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then echo "no workspace version in Cargo.toml"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"
      # A release is only ever cut from an annotated tag, and the tag must
      # name the version in the tree. This runs on both entry points: the
      # manual path is the recovery path, so it needs the check more, not
      # less. Without it a dispatch can publish from a branch ref.
      - name: Require a version tag that matches the tree
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "release must run from a tag, not ${GITHUB_REF_TYPE:-unknown} ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${VERSION}"
            exit 1
          fi
          if [ ! -s "release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "release-notes/${GITHUB_REF_NAME}.md is missing or empty"
            echo "write the release notes, commit them, then re-run"
            exit 1
          fi
      # Ordering convention made mechanical: a tag must not be cut from a
      # commit the wired-system battery has not passed.
      - name: Battery must be green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          row=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/battery.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
                --jq '.workflow_runs[0] | "\(.head_sha) \(.conclusion)"')
          set -- ${row:-none none}
          echo "battery for $GITHUB_SHA: ${2:-none}"
          if [ "${1:-}" != "$GITHUB_SHA" ] || [ "${2:-}" != "success" ]; then
            echo "no successful battery run for $GITHUB_SHA — refusing to cut a release"
            exit 1
          fi
      - name: Install cross linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release binaries (Linux x86_64 + aarch64)
        env:
          # A target without a matching linker fails at link time; the CI
          # cross-arch job only runs `cargo check`, which never links, so
          # this env is the only thing that makes the release build work.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked -p castellan-cli -p castellan-daemon --target x86_64-unknown-linux-gnu
          cargo build --release --locked -p castellan-cli -p castellan-daemon --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            short=$(echo $target | cut -d- -f1)
            cp target/$target/release/castellan dist/castellan-v${VERSION}-linux-${short}
            cp target/$target/release/castellan-daemon dist/castellan-daemon-v${VERSION}-linux-${short}
          done
          cd dist && tar -czf castellan-v${VERSION}-linux-x86_64.tar.gz *x86_64* && tar -czf castellan-v${VERSION}-linux-aarch64.tar.gz *aarch64*
      # Both binaries, both architectures, and the CLI's own version string.
      - name: Verify both binaries, architecture and version
        run: |
          for arch in x86_64 aarch64; do
            case "$arch" in
              x86_64) want="x86-64";;
              aarch64) want="ARM aarch64";;
            esac
            for bin in castellan castellan-daemon; do
              f="dist/${bin}-v${VERSION}-linux-${arch}"
              file "$f" | grep -q "$want" || { echo "$f is not $want: $(file -b "$f")"; exit 1; }
            done
          done
          got=$(dist/castellan-v${VERSION}-linux-x86_64 --version)
          [ "$got" = "castellan ${VERSION}" ] || { echo "CLI reports '$got', expected 'castellan ${VERSION}'"; exit 1; }
      - name: Compute SHA256 checksums
        run: |
          cd dist
          for f in *.tar.gz; do
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS
      - name: Install cosign (SHA-pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A dry run builds and inspects; it must not write to the public Rekor
      # transparency log (entries are permanent), so signing is skipped
      # unless the run is actually going to publish.
      - name: Sign tarballs and checksums (keyless, blocking)
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          cd dist
          for f in *.tar.gz; do
            cosign sign-blob "$f" --bundle "${f}.sig" --yes
          done
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sig --yes
      - name: Verify the signatures just produced
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          cd dist
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sig \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "signature verifies against the workflow identity"
      - name: Show publish command
        run: |
          echo "### Release draft ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh release view ${GITHUB_REF_NAME} -R ${GITHUB_REPOSITORY} --json isDraft,assets" >> "$GITHUB_STEP_SUMMARY"
          echo "gh release edit ${GITHUB_REF_NAME} -R ${GITHUB_REPOSITORY} --draft=false" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Drafts stay editable; a published release is immutable and can only be superseded by a new patch tag." >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          # Draft first: immutable releases cannot be edited once published,
          # and the v* tag ruleset blocks deleting the tag. A draft stays
          # editable and invisible until a human publishes it.
          draft: true
          # Notes live in the tag's checked-in file so a recovery re-run
          # cannot replace hand-written release notes with the template.
          body_path: release-notes/${{ github.ref_name }}.md
