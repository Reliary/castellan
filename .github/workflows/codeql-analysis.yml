name: CodeQL

on:
  push:
    branches: [main, quattro, diff-trust]
  pull_request:
    branches: [main, quattro, diff-trust]
  schedule:
    - cron: '30 8 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      # NOTE: CodeQL's Rust support is immature (no dataflow queries for
      # Rust as of 2026 — it runs build-tracing + a small query pack).
      # Kept as a hygiene signal, not a gate: clippy -D warnings and the
      # shell acceptance suites are the real gates. If CodeQL-for-Rust
      # stays query-poor, replace with a second clippy config (pedantic).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
