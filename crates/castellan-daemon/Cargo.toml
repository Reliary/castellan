[package]
name = "castellan-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "castellan daemon: unix socket, single-writer session state, freezer orchestration."

[lib]
name = "castellan_daemon"
path = "src/lib.rs"

[[bin]]
name = "castellan-daemon"
path = "src/main.rs"

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-freezer = { path = "../castellan-freezer" }
castellan-policy = { path = "../castellan-policy" }
castellan-envelope = { path = "../castellan-envelope" }
castellan-canary = { path = "../castellan-canary" }
castellan-trust = { path = "../castellan-trust" }
castellan-proof = { path = "../castellan-proof" }
castellan-replay = { path = "../castellan-replay" }
castellan-radar = { path = "../castellan-radar" }
castellan-campaign = { path = "../castellan-campaign" }
castellan-drill = { path = "../castellan-drill" }
castellan-memory = { path = "../castellan-memory" }
castellan-voice = { path = "../castellan-voice" }
castellan-ledger = { path = "../castellan-ledger" }
castellan-scan = { path = "../castellan-scan" }
sha2 = "0.10"
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true }
rustc-hash = { workspace = true }
