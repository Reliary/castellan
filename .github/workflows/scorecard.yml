name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '30 7 * * 1'
  push:
    branches: [main, quattro, diff-trust]
  # Manual trigger so a re-score can be forced after a protection or
  # pinning change, without waiting for Monday.
  workflow_dispatch:

# Top level stays read-only: scorecard's webapp verifies permission
# PLACEMENT and rejects the publish with 400 "global perm is set to
# write" if security-events/id-token are declared globally — the two
# writes belong to the job that needs them.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF upload to code scanning.
      security-events: write
      # publish_results: true signs results with Sigstore/Fulcio via
      # OIDC. Without it the action falls back to the interactive
      # device flow — a browser code no runner completes — and fails
      # with expired_token after ~15 min of retries (12 consecutive
      # failures before this line).
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: results.sarif
