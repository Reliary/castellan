[package]
name = "castellan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "castellan CLI: status, freeze, thaw, kill, spawn, adopt."

[[bin]]
name = "castellan"
path = "src/main.rs"

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-policy = { path = "../castellan-policy" }
castellan-envelope = { path = "../castellan-envelope" }
castellan-ledger = { path = "../castellan-ledger" }
castellan-freezer = { path = "../castellan-freezer" }
castellan-broker = { path = "../castellan-broker" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
nix = { workspace = true }
