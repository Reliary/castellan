name: Battery

# The wired-system suites (test/shell.d) need a real user session, a user
# cgroup slice, ptys and Landlock/seccomp, so they cannot run on a
# GitHub-hosted runner. They run on the self-hosted box, against the
# artifact built on the runner, with CASTELLAN_BIN_DIR pointing at it.
#
# Triggers are deliberately push-only plus manual. A self-hosted runner on
# a public repository must never execute code from a fork PR: fork heads
# are not trusted. Pull requests get the hosted CI (unit tests, drift
# gates, doc truth); mainline pushes get the battery.
on:
  push:
    branches: [quattro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  battery:
    runs-on: [self-hosted, linux, x64, battery]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable@2026-10-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binaries
        run: cargo build --release --locked -p castellan-cli -p castellan-daemon

      # Artifact semantics: the battery runs from a directory that holds
      # only the two binaries, the same shape a user gets from a release
      # tarball. If a suite silently depends on something else in target/,
      # it fails here rather than in the field.
      - name: Stage binaries as a user would receive them
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/castellan target/release/castellan-daemon "$RUNNER_TEMP/bin/"
          chmod +x "$RUNNER_TEMP/bin/"*
          "$RUNNER_TEMP/bin/castellan" --version

      - name: Run the battery
        env:
          CASTELLAN_BIN_DIR: ${{ runner.temp }}/bin
          CASTELLAN_LOG_DIR: ${{ runner.temp }}/battery-logs
          CASTELLAN_ALLOW_DESTRUCTIVE: "1"
          SHELL: /bin/sh
        run: ./test/run-all.sh

      # The suites' logs name host paths, user units and journal excerpts.
      # This repository is public, so a run artifact is world-readable: upload
      # only the failure summary the runner already prints to stdout, never
      # the per-suite logs. The full logs remain on the runner under the
      # printed path, reachable by anyone who can log into that box.
      - name: Upload the failure summary
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-failure-summary
          path: ${{ runner.temp }}/battery-logs/**/rows
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up session state
        if: always()
        run: |
          # The battery creates scopes, a daemon and (via p18/p20) real user
          # units. Leave the runner box the way we found it even when a suite
          # dies mid-run or the job is cancelled.
          systemctl --user disable --now castellan.service 2>/dev/null || true
          rm -f ~/.config/systemd/user/castellan.service                 ~/.config/systemd/user/castellan-freeze.service                 ~/.config/systemd/user/castellan-thaw.service 2>/dev/null || true
          systemctl --user daemon-reload 2>/dev/null || true
          systemctl --user reset-failed 2>/dev/null || true
          pkill -9 -f castellan-daemon 2>/dev/null || true
          rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/castellan.sock" 2>/dev/null || true
          # p18 runs uninstall against the ci user's own state; make sure a
          # cancelled run does not leave half of it behind.
          rm -rf ~/.local/state/castellan ~/.config/castellan 2>/dev/null || true
