name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '30 7 * * 1'
  push:
    branches: [main, quattro, diff-trust]

permissions:
  security-events: write
  contents: read
  # publish_results: true signs the results with Sigstore/Fulcio. Without
  # this the action falls back to the interactive device flow — a browser
  # code no runner completes — and fails with expired_token after ~15 min
  # of retries (12 consecutive failures before this line). OIDC lets
  # Fulcio issue the cert non-interactively.
  id-token: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: results.sarif
