[package]
name = "castellan-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "castellan daemon: unix socket, single-writer session state, freezer orchestration."

[lib]
name = "castellan_daemon"
path = "src/lib.rs"

[[bin]]
name = "castellan-daemon"
path = "src/main.rs"

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-freezer = { path = "../castellan-freezer" }
castellan-policy = { path = "../castellan-policy" }
castellan-envelope = { path = "../castellan-envelope" }
serde_json = { workspace = true }
nix = { workspace = true }
rustc-hash = { workspace = true }
