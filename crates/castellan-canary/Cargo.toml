[package]
name = "castellan-canary"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
castellan-core = { path = "../castellan-core" }
castellan-freezer = { path = "../castellan-freezer" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Forwards the P8 drill fault-injection hook (see castellan-core).
drills = ["castellan-core/drills"]
# Fuzz-harness shims only (fuzz/ crate). Off everywhere else; no
# production behavior change.
fuzz = []
