[workspace]
resolver = "2"
members = [
  "crates/castellan-core",
  "crates/castellan-freezer",
  "crates/castellan-policy",
  "crates/castellan-envelope",
  "crates/castellan-ledger",
  "crates/castellan-canary",
  "crates/castellan-trust",
  "crates/castellan-proof",
  "crates/castellan-replay",
  "crates/castellan-radar",
  "crates/castellan-campaign",
  "crates/castellan-drill",
  "crates/castellan-memory",
  "crates/castellan-voice",
  "crates/castellan-pharmaco",
  "crates/castellan-scan",
  "crates/castellan-hub",
  "crates/castellan-trace",
  "crates/castellan-decoy",
  "crates/castellan-policycheck",
  "crates/castellan-broker",
  "crates/castellan-daemon",
  "crates/castellan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["castellan contributors"]
repository = "https://github.com/Reliary/castellan"
description = "The OS is the trust boundary for AI agents."
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
nix = { version = "0.29", features = ["signal", "user", "inotify", "socket"] }
