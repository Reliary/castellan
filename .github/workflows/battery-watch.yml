name: battery-watch

# The battery runs on a single self-hosted machine, and the branch ruleset
# has no required status checks (a solo maintainer cannot review their own
# PR). So a runner that is offline, wedged or out of disk makes every
# mainline push silently untested: the Battery run stays queued, hosted CI
# stays green, and a release can be cut from an unverified commit.
#
# This watchdog runs on a GitHub-hosted runner and fails loudly when either
# (a) the runner is not online, or (b) the newest quattro commit has no green
# Battery run. It never blocks a PR or a merge.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Listing runners needs admin scope, which GITHUB_TOKEN does not have.
      # The observable equivalent with a read token: a run that has sat queued
      # for longer than a job should take means nobody is picking work up.
      - name: Nothing has been stuck in the queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stuck=$(gh run list -R "$GITHUB_REPOSITORY" --workflow battery.yml \
                    --status queued --limit 10 --json createdAt,databaseId \
                    --jq '[.[] | select((now - (.createdAt|fromdateiso8601)) > 1800) | .databaseId] | join(",")')
          if [ -n "$stuck" ]; then
            echo "::error::battery run(s) queued for over 30 minutes: $stuck — the runner is down or wedged"
            exit 1
          fi
          echo "no battery run has been queued for more than 30 minutes"

      - name: The newest mainline commit has a green battery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/quattro" --jq .sha)
          row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow battery.yml \
                  --branch quattro --limit 1 \
                  --json headSha,conclusion,createdAt \
                  --jq '.[0] | "\(.headSha) \(.conclusion // "running") \(.createdAt)"')
          set -- ${row:-none none none}
          echo "head=$head battery_sha=$1 conclusion=$2 at=$3"
          if [ "$1" != "$head" ]; then
            echo "::error::newest quattro commit $head has no battery run (newest run: $1)"
            exit 1
          fi
          if [ "$2" != "success" ]; then
            echo "::error::battery for $head is '$2'"
            exit 1
          fi
