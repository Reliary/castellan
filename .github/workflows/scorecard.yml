name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '30 7 * * 1'
  push:
    branches: [main, quattro, diff-trust]

# Top level stays read-only: scorecard's webapp verifies permission
# PLACEMENT and rejects the publish with 400 "global perm is set to
# write" if security-events/id-token are declared globally — the two
# writes belong to the job that needs them.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF upload to code scanning.
      security-events: write
      # publish_results: true signs results with Sigstore/Fulcio via
      # OIDC. Without it the action falls back to the interactive
      # device flow — a browser code no runner completes — and fails
      # with expired_token after ~15 min of retries (12 consecutive
      # failures before this line).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: results.sarif
