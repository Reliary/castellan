name: ci

on:
  push:
    branches: [main, quattro, diff-trust]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# test/shell.d/*.sh acceptance suites require a real user cgroup slice
# (user@UID.service under systemd) and run on dev machines only, not CI.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      # No `cargo fmt` gate: the repo style is 2-space (AGENTS.md) with no
      # rustfmt.toml, so rustfmt default (4-space) would rewrite 46 files.
      # clippy -D warnings is the style gate.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: no openssl-sys (cross-compile sanity)
        run: |
          if cargo tree -e normal 2>/dev/null | grep -q "openssl-sys"; then
            echo "openssl-sys blocks ARM/static builds"; exit 1; fi
      - name: no sqlite runtime DBs or image binaries committed
        run: |
          if git ls-files | grep -qE '\.sqlite(-journal|-shm|-wal)?$'; then echo "SQLite runtime DBs committed"; exit 1; fi
          if git ls-files | grep -qE '\.(jpe?g|png|gif|bmp|ico)$'; then echo "Binary images committed"; exit 1; fi
          echo "artifact check ok"

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

  # Cross-architecture compile sanity. Castellan is Linux-only
  # (Landlock/seccomp/cgroup), so the matrix is Linux targets only:
  # x86_64 check + aarch64 cross-compile via gcc-aarch64. No macOS/
  # Windows (kernel primitives do not exist there — honestly scoped).
  cross-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - run: cargo check --workspace --target x86_64-unknown-linux-gnu
      # aarch64 uses the bundled-sqlite path (no system linker sqlite);
      # the build-script needs the cross CC, installed above. If the
      # cross toolchain drifts, this job goes red — that IS the signal.
      - run: cargo check --workspace --target aarch64-unknown-linux-gnu

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: cargo install cargo-audit cargo-deny --locked 2>/dev/null || true
      # No pipes without pipefail: `cmd 2>&1 | tail` masks the exit code
      # and a compromised dependency would pass CI silently. Each check
      # tees to a log AND fails the step on advisories/bans/violations.
      - name: cargo audit (blocking)
        run: cargo audit --deny warnings
      - name: cargo deny advisories (blocking)
        run: cargo deny check advisories
      - name: cargo deny bans+licenses+sources (blocking)
        run: cargo deny check bans licenses sources

  # Kernel-drift gate for the seccomp denylist.
  #
  # The filter is a denylist (commitment #8), so its risk is not a
  # mistake in today's list but a kernel upgrade that adds a syscall
  # nobody enumerated. This reads the capability-class table in
  # crates/castellan-envelope/src/syscall_classes.rs, checks the table
  # and the filter agree in BOTH directions against the running
  # kernel's own syscall table, and fails if a Hard class claims a
  # closure the filter does not have, a blocked syscall has no class,
  # a class member is not a real syscall, or a Probed class gains a
  # member its written residual does not cover.
  syscall-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p castellan-envelope --example syscall-classes
      - run: bash test/syscall-drift.sh

  # Workload-syscall probe.
  #
  # A Hard class is only safe to block if the workload does not need it.
  # Today that is an argument (git needs chmod, cargo needs utime) whose
  # supporting measurement was a one-off. This re-derives it on every
  # run: a ptrace-based probe (no strace) traces eight representative
  # workloads — including a real `rustc -O` compile and a real
  # `git commit` — and fails if any of them needs a Hard-class syscall.
  workload-syscalls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p castellan-envelope --example syscall-probe
      - run: python3 test/workload-syscalls.py

  # diff-trust gate (A+B): structural blast + scope-creep.
  #
  # A is only safe to ship if sig_name precision on real touched files
  # stays >= 0.80 and caller-count agrees with rg ground truth within
  # 20%; B is only safe if clean-session false-positive stays at zero
  # on the fixture corpus. This re-derives both on every run from the
  # repo's own sources (no fixture files to rot — the corpus IS the
  # repo). Cert latency is bounded so the keep path cannot regress
  # into a slow gate.
  diff-trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p castellan-proof structural -- --nocapture 2>&1 | tail -3
      - name: sig_name precision on repo sources
        run: python3 test/diff-trust-gate.py --check precision --min 0.80
      - name: caller-count agreement vs rg ground truth
        run: python3 test/diff-trust-gate.py --check callers --max-disagree 0.20
      - name: cert assembly latency bound
        run: python3 test/diff-trust-gate.py --check latency --max-ms 2000

  # ssh/deputy/system-bus escape regressions (P13 C37): the b8 shell
  # suite asserts all three live (needs a cgroup slice, dev-box only), so
  # CI pins the same rules at unit level — if `new()` ever stops denying
  # loopback ssh, docker.sock, or the system bus, CI goes red even
  # though b8 never runs there. E-d (TCP control plane) was refuted by
  # code: the daemon binds only a unix socket.
  escape-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p castellan-broker loopback_ssh -- --nocapture 2>&1 | tail -5
      - run: cargo test -p castellan-broker llm_only -- --nocapture 2>&1 | tail -5
      - run: cargo test -p castellan-broker deputy -- --nocapture 2>&1 | tail -5
      - run: cargo test -p castellan-broker system_bus -- --nocapture 2>&1 | tail -5
