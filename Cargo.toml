[workspace]
resolver = "2"
members = [
  "crates/castellan-core",
  "crates/castellan-freezer",
  "crates/castellan-daemon",
  "crates/castellan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["castellan contributors"]
repository = "https://github.com/Reliary/castellan"
description = "The OS is the trust boundary for AI agents."
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
nix = { version = "0.29", features = ["signal", "user"] }
