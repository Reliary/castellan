name: Secret scan

on:
  pull_request:
    branches: [main, quattro, diff-trust]
  push:
    branches: [main, quattro, diff-trust]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The gitleaks-action needs a paid GITLEAKS_LICENSE for organisation
      # repos (Reliary is an org — 14 sibling workflows carry the secret).
      # The binary is MIT and needs none. Version-pinned, not tag-floating.
      #
      # Config: DEFAULT ruleset, deliberately — no .gitleaks.toml. The
      # sibling config files omit `useDefaultConfig = true`, which makes
      # gitleaks *replace* the full default ruleset with only three rules;
      # borrowing that file would be a coverage downgrade. Local
      # pre-enable run (v8.30.1): 134 commits, 1.62 MB, no leaks found.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (full history)
        run: gitleaks detect --redact --verbose
