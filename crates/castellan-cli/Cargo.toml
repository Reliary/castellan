[package]
name = "castellan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "castellan CLI: status, freeze, thaw, kill, spawn, adopt."

[[bin]]
name = "castellan"
path = "src/main.rs"

[dependencies]
castellan-core = { path = "../castellan-core" }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
