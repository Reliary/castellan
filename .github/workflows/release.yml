name: Release

on:
  push:
    tags: ['v*']

# id-token: write — keyless cosign (OIDC → Fulcio). Signing is blocking:
# a release that cannot be signed must not publish unsigned.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Privilege-bearing job (id-token: write + contents: write): every
      # action is SHA-pinned (review F-1 — the repo's own pinning rule).
      # rust-toolchain: pin is the stable BRANCH head (the action infers
      # the toolchain from the ref name, so the input makes it explicit);
      # rust-cache: annotated tag v2 peels to the v2.9.2 commit.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable@2026-10-03
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cross linker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release binaries (Linux x86_64 + aarch64)
        run: |
          cargo build --release -p castellan-cli -p castellan-daemon --target x86_64-unknown-linux-gnu
          cargo build --release -p castellan-cli -p castellan-daemon --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            short=$(echo $target | cut -d- -f1)
            cp target/$target/release/castellan dist/castellan-v${VERSION}-linux-${short}
            cp target/$target/release/castellan-daemon dist/castellan-daemon-v${VERSION}-linux-${short}
          done
          cd dist && tar -czf castellan-v${VERSION}-linux-x86_64.tar.gz *x86_64* && tar -czf castellan-v${VERSION}-linux-aarch64.tar.gz *aarch64*
      - name: Compute SHA256 checksums
        run: |
          cd dist
          for f in *.tar.gz; do
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS
      - name: Install cosign (SHA-pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign tarballs and checksums (keyless, blocking)
        run: |
          cd dist
          for f in *.tar.gz; do
            cosign sign-blob "$f" --bundle "${f}.sig" --yes
          done
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sig --yes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          body: |
            ## Verify

            ```sh
            # checksums
            sha256sum -c --ignore-missing SHA256SUMS

            # signatures (keyless; requires cosign >= 2.x)
            cosign verify-blob \
              --bundle SHA256SUMS.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              SHA256SUMS
            ```

            Each `.tar.gz` also carries its own `.sig` bundle; verify it the
            same way with `--bundle <tarball>.sig` and the tarball as the blob.
          draft: false
