name: Dependency review

on:
  pull_request:

# Posts the PR summary comment → needs pull-requests: write (hence the
# SHA-pinned action under the privilege-bearing pinning rule).
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      # Precondition verified 2026-10-02: /dependency-graph/sbom returns
      # 125 packages from this repo's Cargo.lock, so the dependency graph
      # is active and cargo PR diffs are visible to this action (the
      # cargo-blind failure mode the ci-audit plan flagged).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Mirrors deny.toml's allow list plus two workflow-scope
          # additions (deny.toml stays authoritative for shipped crates;
          # this list also gates workflow action metadata that
          # cargo-deny never sees). NCSA came from the first run's real
          # finding: libfuzzer-sys (fuzz/Cargo.lock) is (MIT OR
          # Apache-2.0) AND NCSA — OSI-approved, fuzz-only dev
          # dependency, never in a release binary. LGPL-3.0 came from
          # the 2026-10-03 F-1 pin: Swatinem/rust-cache@6323deb is
          # genuinely LGPL-3.0, which tag-refs never surfaced — SHA
          # pinning made the license visible (that is the gate working,
          # not a regression). Copyleft attaches to distributing the
          # modified library; running a hosted action in CI distributes
          # nothing to users. Same pattern as NCSA: scoped addition,
          # written rationale, shipped-crate policy unchanged.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-3-Clause, ISC, Unicode-DFS-2016, Unicode-3.0, Zlib, CC0-1.0,
            MPL-2.0, NCSA, LGPL-3.0
          comment-summary-in-pr: always
