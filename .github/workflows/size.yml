name: Binary size

on:
  push:
    branches: [main, quattro, diff-trust]
  pull_request:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable@2026-10-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release
        run: cargo build --release -p castellan-cli -p castellan-daemon
      - name: Report size
        run: |
          ls -lh target/release/castellan target/release/castellan-daemon
          MAX=15728640 # 15 MB budget, same as sibling projects
          # Both binaries get the budget — the CLI was previously unchecked.
          for b in castellan castellan-daemon; do
            SIZE=$(stat -c %s "target/release/$b")
            echo "$b size (bytes): $SIZE"
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "$b exceeded 15MB budget"
              exit 1
            fi
          done
